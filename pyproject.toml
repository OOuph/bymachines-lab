[project]
name = "bymachines-lab"
version = "0.1.0"
description = "By Machines Lab — open measurement of how AI assistants pick businesses (frozen prompt panel, repeated runs, citations, frequencies with confidence intervals)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
