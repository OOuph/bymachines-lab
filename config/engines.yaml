# By Machines Lab — engines and tunables. DRAFT 2026-09-28 (SPEC v1 §8).
# Prices and model ids ⚠ verified against the vendors' pages on 2026-09-28 (docs/api-check-2026-09-28.md).
# Everything here is a parameter; the code reads it and never hard-codes a model, a price or a threshold.

schema_version: 1

# ---- tunables (SPEC §8) ----
runs_per_week: 7                 # 1 run per day; run_idx = ISO weekday
weekly_budget_usd: 50            # owner decision 12
budget_cut_order: [twist, provider_locations_3, agent_core]   # applied in this order when the projection exceeds the cap; agent core last
provider_locations_reduced: [lisbon, madrid, london]           # strategy §5.2 fallback for the provider class
concurrency: 4                   # overall in-flight calls
retries: 3                       # exponential backoff, honours Retry-After
daily_hour_utc: 6
catch_up_days: 1                 # SPEC Q7: heal one missed weekday, flag catch_up=1; longer gaps stay gaps
default_search_context_size: medium

# ---- per-call estimate used by the budget guard for cells not yet run (calibrated on the S1 smoke, 10 live gpt-6-sol calls, 2026-09-28:
#      median input 18 870 tokens of which ~4 400 cached, output ~490 incl. ~130 reasoning tokens even at effort none, 1.4 searches/call,
#      mean $0.0447/call; the estimate ignores the cache discount → slightly conservative) ----
estimate_tokens: {input: 16500, output: 500, input_no_search: 300}
estimate_search_calls: 1.4

engines:
  openai:
    enabled: true
    name: ChatGPT (OpenAI Responses API, web_search)
    api: openai_responses            # POST https://api.openai.com/v1/responses
    model: gpt-6-sol                 # SPEC Q1 default (b): sol for provider/agent/twist, luna for the rest
    model_by_class: {problem: gpt-6-luna, compare: gpt-6-luna, brand: gpt-6-luna, agency: gpt-6-luna}
    reasoning_effort: none           # GPT-6 "no reasoning" mode; gpt-6-astra does not support it
    tool: web_search
    search_context_size: medium
    include_sources: true            # include: ["web_search_call.action.sources"]
    supports_location: true          # user_location {type: approximate, country, city, region, timezone}; omitted = United States → always sent
    timeout_s: 180
    price:                           # USD; verified 2026-09-28
      per_1m_input: {gpt-6-sol: 2.00, gpt-6-luna: 0.10}
      per_1m_cached_input: {gpt-6-sol: 0.20, gpt-6-luna: 0.01}
      per_1m_output: {gpt-6-sol: 10.00, gpt-6-luna: 0.50}
      per_search_call: 0.010         # $10 per 1 000 web_search calls; each action.type == "search" counts
    env: [OPENAI_API_KEY]

  perplexity:
    enabled: true
    name: Perplexity (Agent API, perplexity/sonar + web_search)
    api: perplexity_agent            # POST https://api.perplexity.ai/v1/agent — legacy /chat/completions lost support 2026-09-27 (re-routed to presets)
    model: perplexity/sonar
    tool: web_search
    search_context_size: medium
    supports_location: true          # tool.user_location {country, region, city}
    max_qps: 1                       # Tier 0: 1 request per second per organisation
    timeout_s: 120
    price:                           # USD; verified 2026-09-28; the response also carries usage.cost.total_cost (authoritative)
      per_1m_input: {perplexity/sonar: 0.25}
      per_1m_output: {perplexity/sonar: 2.50}
      per_search_call: 0.0025        # $2.50 per 1 000 web_search tool calls
    env: [PERPLEXITY_API_KEY]

  gemini:
    enabled: true                    # owner decision 2026-09-28 (SPEC Q6 → a): run from 2026-10-01; Gemini API terms revisited at the legal reading 12–18.10
    name: Gemini (Google Search grounding)
    api: gemini_generate_content     # POST https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent (legacy, fully supported)
    model: gemini-3.8-flash
    tool: google_search
    supports_location: false         # no location parameter in the Gemini API (Vertex only) → location 'n/a'
    timeout_s: 120
    price:                           # USD; verified 2026-09-28 (token prices valid through 2026-12-31, then ×2)
      per_1m_input: {gemini-3.8-flash: 0.75}
      per_1m_output: {gemini-3.8-flash: 3.75}
      per_search_query: 0.014        # $14 per 1 000 search queries beyond 5 000 free per month (paid tier); counted from webSearchQueries
      free_search_queries_per_month: 5000
    env: [GEMINI_API_KEY]

  dataforseo:
    enabled: true                    # owner decision 2026-09-28 (SPEC Q6 → a); AI Mode availability for PT/ES/CY still to be confirmed by one live call per city (S2)
    name: Google AI Mode (DataForSEO SERP API)
    api: dataforseo_ai_mode          # POST /v3/serp/google/ai_mode/task_post + task_get/advanced (standard queue); live/advanced for smoke
    model: google-ai-mode            # label for the engines/runs tables: the SERP API has no model choice, the surface is Google AI Mode
    queue: standard                  # standard | priority | live
    language_code: en
    device: desktop
    supports_location: true          # location_code from config/locations.yaml
    timeout_s: 120
    price:                           # USD per request; verified 2026-09-28; the task response also carries `cost` (authoritative)
      per_request: {standard: 0.0012, priority: 0.0024, live: 0.004}
      bing_site_query_live: 0.010    # census: Bing organic live with the site: operator (×5)
    env: [DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD]
