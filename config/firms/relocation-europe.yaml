# By Machines Lab — firm list, vertical #1 "relocation-europe". SEED v0 2026-09-28.
# The real list is built from week-1 baseline answers (manual check, HANDOFF-dev §3.4) plus a control sample from
# registries (rule to be decided by the owner — SPEC §12). Mentions are re-extracted from raw JSON whenever this
# file changes (rules_version = sha256 of this file), so a late list costs nothing.
#
# Entity model (vertical-agnostic, decision 27 — everything here is config, the code is generic):
#   kind:    firm | person | institution | product   — the unit that is credited with the mention
#   parent:  id of the firm a person/product/institution is credited to (an alias by another name); omit for firms
#   type:    law | tax | formation | relocation | other
#   own:     true → our own rows (By Machines, Dilex); kept in the DB, excluded from every published table (HANDOFF-dev §3.4)
#   aliases: matched case-insensitively after normalisation of punctuation and legal forms
#            (Lda, S.L., Ltd, LLC, Advogados, Abogados, & Associados …). An alias shared by two ids fails validation.

schema_version: 1
vertical: relocation-europe

# Extraction settings (S3). Candidates for the weekly `unmatched` review are cited domains that belong to no firm and
# capitalised 2–5-word names; these lists keep the queue readable. Grow them from the queue itself, with a date.
unmatched_ignore_domains: [gov.pt, gov.es, gov.cy, europa.eu, aima.gov.pt, sef.pt, portaldasfinancas.gov.pt, eportugal.gov.pt,
                           exteriores.gob.es, agenciatributaria.es, moi.gov.cy, mof.gov.cy, oa.pt, occ.pt, cysec.gov.cy,
                           expatica.com, movingto.com, nomadgate.com, internations.org, expatforum.com, numbeo.com, statista.com,
                           investopedia.com]
unmatched_ignore_terms: [Portugal, Spain, Cyprus, Lisbon, Porto, Madrid, Barcelona, Limassol, Nicosia, Europe, European Union, EU, EEA,
                         Golden Visa, D7 Visa, D8 Visa, D2 Visa, D7, D8, D2, Digital Nomad Visa, Non-Lucrative Visa, Beckham Law, NHR, IFICI, Non-Dom, AIMA, SEF,
                         ARI, Schengen, Social Security, Tax Identification Number, NIF, NIE, TIE, VAT, United States, United Kingdom, Brazil,
                         AI, ChatGPT, Google, Gemini, Perplexity, By Machines,
                         # 2026-09-29, from the smoke-run queue (generic phrases of an assistant's answer, not firms):
                         Passive Income, Power of Attorney, PoA, Fee Expectations, Home Country, Double Taxation Treaties, DTT,
                         Cross-Border Tax Awareness, Scope of Representation, Verify Registration, North American, Portuguese Bar Association,
                         Portuguese Bar, Ordem dos Advogados, Ordem dos Contabilistas Certificados, OCC, Portuguese Tax Authority, CPA, VFS,
                         Rio de Janeiro, Next Step, Next Steps]
source_types:
  directory: [lawzana.com, legal500.com, chambers.com, clutch.co, sortlist.com, justia.com, hg.org, martindale.com, lexology.com,
              leadersleague.com, iclg.com, expatriates.com]
  forum: [reddit.com, quora.com, expatforum.com, internations.org, facebook.com]
  official: [gov.pt, gov.es, gov.cy, europa.eu, aima.gov.pt, sef.pt, portaldasfinancas.gov.pt, eportugal.gov.pt, exteriores.gob.es,
             agenciatributaria.es, moi.gov.cy, mof.gov.cy, oa.pt, occ.pt, cysec.gov.cy]   # bar and accountants' orders count as official

firms:
  - id: plmj
    canonical: PLMJ
    kind: firm
    type: law
    country: PT
    website: plmj.com
    aliases: ["PLMJ Advogados", "PLMJ Law Firm", "PLMJ - Sociedade de Advogados"]
    note: positive control for extraction (panel prompt B04)

  - id: bymachines
    canonical: By Machines
    kind: firm
    type: other
    country: CY
    website: bymachines.ai
    aliases: ["bymachines.ai", "By Machines Lab", "Relocation Lab by By Machines"]
    own: true

  - id: dilex
    canonical: Dilex
    kind: firm
    type: other
    country: CY
    website: dilex.ltd
    aliases: ["Dilex LTD", "dilex.ltd"]   # matching is case-insensitive: one spelling per alias
    own: true
