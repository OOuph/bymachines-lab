  - {id: G04, class: agency, country: none, text: "how do I get my company recommended by ChatGPT"}
  - {id: G05, class: agency, country: none, text: "why doesn't Perplexity mention my brand"}
  - {id: G06, class: agency, country: none, text: "how to measure AI visibility for a B2B company"}
  - {id: G07, class: agency, country: none, text: "GEO vs SEO agency: what is the difference"}
